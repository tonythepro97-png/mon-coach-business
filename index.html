<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lance ton business – coach pour débutants</title>
<style>
  :root {
    --paper: #eef2f5;
    --surface: #ffffff;
    --ink: #14213d;
    --muted: #5b6b82;
    --line: #d3dce6;
    --accent: #f2a900;
    --accent-ink: #14213d;
    --user: #14213d;
    --user-ink: #ffffff;
    --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0f1626;
      --surface: #182238;
      --ink: #e9eef7;
      --muted: #9aa9c2;
      --line: #2a3a58;
      --user: #f2a900;
      --user-ink: #14213d;
      --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 0 16px;
  }
  header { padding: 24px 0 12px; }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); max-width: 60ch; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--surface);
    overflow-wrap: anywhere;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user);
    color: var(--user-ink);
    border-color: var(--user);
  }
  .msg.bot { align-self: flex-start; }
  .msg.error { color: var(--err); border-color: var(--err); }
  .starters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .starters button {
    font: inherit;
    font-size: 0.9rem;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .starters button:hover { border-color: var(--accent); }
  form {
    display: flex;
    gap: 8px;
    padding: 12px 0 8px;
  }
  textarea {
    flex: 1;
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    resize: none;
    min-height: 46px;
    max-height: 140px;
  }
  button.send {
    font: inherit;
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-ink);
    border: 0;
    border-radius: 12px;
    padding: 0 18px;
    cursor: pointer;
  }
  button.send:disabled { opacity: 0.5; cursor: default; }
  textarea:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  footer { color: var(--muted); font-size: 0.8rem; padding: 0 0 12px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Lance ton business, une étape à la fois</h1>
    <p>Un coach pour les débutants : de l'idée aux premiers clients, puis la suite.</p>
  </header>

  <div id="log" aria-live="polite"></div>

  <form id="form">
    <textarea id="input" rows="1" placeholder="Décris ton idée, même si elle est floue…" aria-label="Ton message"></textarea>
    <button class="send" id="send" type="submit">Envoyer</button>
  </form>
  <footer>Information générale seulement : pas de conseil financier, juridique ou fiscal personnalisé, et aucun résultat garanti.</footer>
</div>

<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const history = [];

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function format(text) {
    return escapeHtml(text)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\n/g, "<br>");
  }
  function addMessage(role, text, extraClass) {
    const div = document.createElement("div");
    div.className = "msg " + role + (extraClass ? " " + extraClass : "");
    div.innerHTML = format(text);
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  // Message d'accueil + suggestions de départ
  addMessage("bot", "Salut ! Je t'aide à lancer ton business, même si tu pars de zéro. On avance ensemble, une petite étape à la fois.\n\n**C'est quoi ton idée de business, même si elle est encore floue ?**");
  const starters = document.createElement("div");
  starters.className = "starters";
  ["J'ai une idée mais je ne sais pas par où commencer", "Je n'ai pas d'idée, aide-moi à en trouver une", "J'ai très peu d'argent à investir"].forEach((t) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = t;
    b.addEventListener("click", () => { starters.remove(); send(t); });
    starters.appendChild(b);
  });
  log.appendChild(starters);

  async function send(text) {
    if (!text.trim()) return;
    addMessage("user", text);
    history.push({ role: "user", content: text });
    input.value = "";
    sendBtn.disabled = true;
    const waiting = addMessage("bot", "…");

    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await r.json();
      waiting.remove();
      if (!r.ok) {
        addMessage("bot", data.error || "Une erreur est survenue. Réessaie dans un instant.", "error");
        history.pop();
      } else {
        addMessage("bot", data.reply);
        history.push({ role: "assistant", content: data.reply });
      }
    } catch (e) {
      waiting.remove();
      addMessage("bot", "Connexion impossible. Vérifie ton internet et réessaie.", "error");
      history.pop();
    }
    sendBtn.disabled = false;
    input.focus();
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); send(input.value); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
</script>
</body>
</html>
